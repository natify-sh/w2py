name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.14
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: python3 tools/check_docs.py
      - run: python3 tools/features.py --check
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.15t", "pypy3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q
      # the measured native stack bounds and the JIT's budget (D10), once; and on musl (128 KiB threads)
      - if: matrix.python == '3.13'
        run: uv run python tools/stack_info.py
      - if: matrix.python == '3.13'
        run: docker run --rm -v "$PWD:/w" -w /w python:3.13-alpine python tools/stack_info.py
  jit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      # llvm-mc (encoder check) and objdump/objcopy (ISA check); the tests skip without them.
      - run: command -v llvm-mc || (sudo apt-get update && sudo apt-get install -y llvm binutils)
      - run: llvm-mc --version && objdump --version | head -1
      - run: uv run pytest tests/jit -v -rs
        env:
          W2PY_JIT_REQUIRE: "1"  # a missing tool fails the job instead of skipping (tests/jit)
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ runner.os }}-${{ hashFiles('tests/spec/fetch.py', 'tests/spec/spectest.wat') }}
      - run: uv run python tests/spec/fetch.py
      - run: uv run python -m tests.spec.run --engine wasmtime --json spec-wasmtime.json
      - run: uv run python -m tests.spec.run --engine pyc --json spec-pyc.json
      - run: uv run python -m tests.spec.run --engine jit-x86_64 --json spec-jit-x86_64.json
      # executable memory forbidden (MDWE): `auto` must warn once and give pyc's numbers
      - run: uv run python tools/no_exec.py -- uv run python -m tests.spec.run --engine auto
  os:
    # Windows x64 and macOS x64 (Intel); arm64 runners come with jit-aarch64. tests/jit runs inside
    # pytest here: llvm-mc/objdump checks skip where the tools are absent (no W2PY_JIT_REQUIRE).
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # Windows console code page
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      - run: uv run pytest -q -rs --ignore=tests/jit
      # which JIT tests ran here, and the native stack bounds of the deepest-host case (D10)
      - run: uv run pytest tests/jit -v -rs
      - if: ${{ !cancelled() }}
        run: uv run pytest tests/jit/test_abi.py -v -s -k deepest
      - if: ${{ !cancelled() }}
        run: uv run python tools/stack_info.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ runner.os }}-${{ hashFiles('tests/spec/fetch.py', 'tests/spec/spectest.wat') }}
      - run: uv run python tests/spec/fetch.py
      - run: uv run python -m tests.spec.run --engine wasmtime
      - run: uv run python -m tests.spec.run --engine pyc
