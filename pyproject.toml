[project]
name = "w2py"
version = "0.0.0"
description = "A WebAssembly compiler in pure Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "w2py"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "wasmtime==50.0.1",
    "wasm-tools-package==1.262.0.0",
    "pywasm",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["poc", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
include = ["src/w2py", "tests"]
exclude = ["poc"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["UP031"]
# Ported PoC code (pyright: basic in the files): keep its style findings out of the way for now.
"src/w2py/frontend/binary.py" = ["E501", "UP031"]
"src/w2py/targets/pyc/codegen.py" = ["E501", "B007", "B023", "B905", "UP031"]
"src/w2py/targets/pyc/runtime.py" = ["E401", "E501", "E701", "E702", "I001", "UP031"]
